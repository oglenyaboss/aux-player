version: 2

before:
  hooks:
    - go mod tidy

builds:
  # Linux is the only published platform. Both architectures link GStreamer
  # through CGO, so each is built natively on its own runner: the amd64 target
  # in the release job, the arm64 target on the arm64 runner. Each job sets the
  # other's AUX_SKIP_* variable, so only its own target is built.
  - id: aux-linux-amd64
    binary: aux
    # Set to 1 by the arm64 release job.
    skip: '{{ eq (index .Env "AUX_SKIP_AMD64") "1" }}'
    ldflags:
      - -s -w
      - -X 'github.com/oglenyaboss/aux-player/internal/version.Version={{ .Version }}'
    env:
      - CGO_ENABLED=1
      - GOTOOLCHAIN=local
    goos:
      - linux
    goarch:
      - amd64

  - id: aux-linux-arm64
    binary: aux
    # Set to 1 by the amd64 release job.
    skip: '{{ eq (index .Env "AUX_SKIP_ARM64") "1" }}'
    ldflags:
      - -s -w
      - -X 'github.com/oglenyaboss/aux-player/internal/version.Version={{ .Version }}'
    env:
      - CGO_ENABLED=1
      - GOTOOLCHAIN=local
    goos:
      - linux
    goarch:
      - arm64

archives:
  - id: aux
    ids:
      - aux-linux-amd64
      - aux-linux-arm64
    name_template: "aux_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    # Setting files replaces GoReleaser's default list, so the three it adds on
    # its own are restated. The desktop file and icon let a distro package
    # install everything from this one archive; NOTICE carries the upstream
    # licence notice.
    files:
      - LICENSE*
      - README*
      - CHANGELOG*
      - NOTICE
      - internal/assets/io.github.oglenyaboss.aux.desktop
      - internal/assets/aux-icon.svg

checksum:
  name_template: "checksums.txt"
  algorithm: sha256
  # The arm64 archive is built on the arm64 job and handed to the release job
  # as ./dist-arm64, outside the dist/ that --clean wipes.
  extra_files:
    - glob: ./dist-arm64/*.tar.gz

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: oglenyaboss
    name: aux-player
  draft: false
  prerelease: auto
  replace_existing_artifacts: true
  extra_files:
    - glob: ./dist-arm64/*.tar.gz
