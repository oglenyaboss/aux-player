name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Linux/arm64 is built here rather than in the release job below because the
  # GStreamer backends are CGO: cross-compiling needs a full aarch64 toolchain
  # and arm64 GStreamer development packages, which a native arm64 runner has
  # already. The archives are handed to the release job, which attaches them to
  # the same release via extra_files.
  linux-arm64:
    name: build-linux-arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --fix-missing libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Build arm64 archives
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean --skip=publish
        env:
          AUX_SKIP_AMD64: '1'
          GOTOOLCHAIN: local

      - name: Upload arm64 archives
        uses: actions/upload-artifact@v4
        with:
          name: arm64-archives
          path: dist/*.tar.gz
          if-no-files-found: error
          # Consumed by the next job; the same bytes ship on the release.
          retention-days: 1

  release:
    name: release
    needs: linux-arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --fix-missing libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Download arm64 archives
        uses: actions/download-artifact@v4
        with:
          name: arm64-archives
          path: dist-arm64

      - name: Check arm64 archives
        run: |
          # extra_files globs quietly when nothing matches, so without this the
          # release would publish with no arm64 binary and no error anywhere.
          f="dist-arm64/aux_linux_arm64.tar.gz"
          [ -s "$f" ] || { echo "missing $f"; exit 1; }
          tar tzf "$f" | grep -qx aux || { echo "$f contains no aux binary"; exit 1; }
          ls -l dist-arm64

      - name: Extract CHANGELOG entry
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extracts the section for VERSION from CHANGELOG.md.
          # Expected format: "## [X.Y.Z] — YYYY-MM-DD" headers.
          awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found" CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG entry found for version ${VERSION}" > release_notes.md
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean --release-notes=release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUX_SKIP_ARM64: '1'
          GOTOOLCHAIN: local
