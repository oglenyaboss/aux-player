pre-commit:
  parallel: true
  commands:
    gofmt:
      glob: "*.go"
      run: |
        unformatted=$(gofmt -l {staged_files})
        if [ -n "$unformatted" ]; then
          echo "Unformatted Go files (run gofmt -w):"
          echo "$unformatted"
          exit 1
        fi
    merge-conflict:
      run: |
        if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- {staged_files}; then
          echo "Merge conflict markers found"
          exit 1
        fi

pre-push:
  parallel: true
  commands:
    go-vet:
      run: go vet ./...
    golangci-lint:
      run: golangci-lint run --config=.golangci.yml --fix=false
    go-test:
      run: go test ./...
    cross-build:
      run: GOOS=darwin CGO_ENABLED=0 go build ./... && GOOS=windows CGO_ENABLED=0 go build ./...
    go-mod-tidy:
      glob: "{*.go,go.mod,go.sum}"
      run: go mod tidy && git diff --exit-code go.mod go.sum
    musickit-js-test:
      glob: "internal/player/web/musickit*"
      run: node internal/player/web/musickit_test.mjs
